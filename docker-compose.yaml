services:
  db-auth-service:
    container_name: auth-service-db
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-auth}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-authpass}
      POSTGRES_DB: ${DB_DATABASE:-auth_service_db}
    volumes:
      - ./auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata-auth:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  targeting-db:
    container_name: targeting-db
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${TARGETING_DB_USERNAME:-targeting}
      POSTGRES_PASSWORD: ${TARGETING_DB_PASSWORD:-targetingpass}
      POSTGRES_DB: ${TARGETING_DB_DATABASE:-targeting_service_db}
    volumes:
      - ./targeting-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata-targeting:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  flag-service-db:
    container_name: flag-service-db
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${FLAG_DB_USERNAME:-flag}
      POSTGRES_PASSWORD: ${FLAG_DB_PASSWORD:-flagpass}
      POSTGRES_DB: ${FLAG_DB_DATABASE:-flag_service_db}
    volumes:
      - ./flag-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata-flag:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  redis:
    container_name: redis-evaluation-service
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  auth-service:
    container_name: auth-service
    build: ./auth-service
    restart: always
    environment:
      DATABASE_URL: postgres://${DB_USERNAME:-auth}:${DB_PASSWORD:-authpass}@db-auth-service:5432/${DB_DATABASE:-auth_service_db}
      PORT: "8001"
      MASTER_KEY: ${MASTER_KEY:-local-master-key-change-me}
    ports:
      - "8001:8001"
    depends_on:
      - db-auth-service

  flag-service:
    container_name: flag-service
    build: ./flag-service
    restart: always
    environment:
      DATABASE_URL: postgresql://${FLAG_DB_USERNAME:-flag}:${FLAG_DB_PASSWORD:-flagpass}@flag-service-db:5432/${FLAG_DB_DATABASE:-flag_service_db}
      PORT: "8002"
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8001/auth}
    ports:
      - "8002:8002"
    depends_on:
      - flag-service-db
      - auth-service

  targeting-service:
    container_name: targeting-service
    build: ./targeting-service
    restart: always
    environment:
      DATABASE_URL: postgresql://${TARGETING_DB_USERNAME:-targeting}:${TARGETING_DB_PASSWORD:-targetingpass}@targeting-db:5432/${TARGETING_DB_DATABASE:-targeting_service_db}
      PORT: "8003"
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8001/auth}
    ports:
      - "8003:8003"
    depends_on:
      - targeting-db
      - auth-service

  evaluation-service:
    container_name: evaluation-service
    build: ./evaluation-service
    restart: always
    environment:
      PORT: "8004"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      FLAG_SERVICE_URL: ${FLAG_SERVICE_URL:-http://flag-service:8002}
      TARGETING_SERVICE_URL: ${TARGETING_SERVICE_URL:-http://targeting-service:8003/targeting}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      AWS_SQS_URL: ${AWS_SQS_URL:-}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "8004:8004"
    depends_on:
      - redis
      - flag-service
      - targeting-service

  analytics-service:
    container_name: analytics-service
    build: ./analytics-service
    restart: always
    environment:
      PORT: "8005"
      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_SQS_URL: ${AWS_SQS_URL:-}
      AWS_DYNAMODB_TABLE: ${AWS_DYNAMODB_TABLE:-ToggleMasterAnalytics}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "8005:8005"

volumes:
  pgdata-auth:
  pgdata-targeting:
  pgdata-flag:
