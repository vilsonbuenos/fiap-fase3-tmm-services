name: Reusable DevSecOps CI

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      language:
        required: true
        type: string
        description: "go ou python"
      working_directory:
        required: true
        type: string
      skip_aws_push:
        required: false
        type: boolean
        default: true
        description: "true = nao faz login/push ECR nem GitOps (merge na main sem AWS)"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_REGION:
        required: false
      AWS_ACCOUNT_ID:
        required: false
      GITOPS_TOKEN:
        required: false
      GITOPS_REPO:
        required: false

jobs:
  unit-test:
    name: Build and Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Go test
        if: inputs.language == 'go'
        run: |
          go mod tidy
          go test ./...

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python test
        if: inputs.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          if [ -d tests ]; then pytest -q; else echo "Nenhum teste unitario encontrado"; fi

  lint:
    name: Linter and Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download Go modules
        if: inputs.language == 'go'
        run: go mod tidy

      - name: golangci-lint
        if: inputs.language == 'go'
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: ${{ inputs.working_directory }}
          args: --timeout=3m
          skip-cache: true
          verify: false

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: flake8
        if: inputs.language == 'python'
        run: |
          pip install flake8
          flake8 . --select=E9,F63,F7,F82 --exclude=.venv,tests

  security:
    name: SAST and SCA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: gosec (SAST Go)
        if: inputs.language == 'go'
        run: |
          go mod tidy
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity high -exclude=G107,G114 -quiet ./...

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: bandit (SAST Python)
        if: inputs.language == 'python'
        run: |
          pip install bandit
          bandit -r . -lll -x ./tests

      - name: Trivy SCA filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working_directory }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  docker:
    name: Docker Build Scan and Push
    needs: [unit-test, lint, security]
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: v1.0.0-${{ github.sha }}
      SHORT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=v1.0.0-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build -t togglemaster/${{ inputs.service_name }}:${{ steps.meta.outputs.tag }} ${{ inputs.working_directory }}

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: togglemaster/${{ inputs.service_name }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Skip ECR and GitOps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.skip_aws_push
        run: |
          echo "DevSecOps concluido (test, lint, SAST, SCA, image scan)."
          echo "ECR e GitOps ignorados: SKIP_AWS_PUSH esta ativo."

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.skip_aws_push == false
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.skip_aws_push == false
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.skip_aws_push == false
        env:
          ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          REGION: ${{ secrets.AWS_REGION }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          DEST="${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/togglemaster/${{ inputs.service_name }}:${TAG}"
          docker tag "togglemaster/${{ inputs.service_name }}:${TAG}" "$DEST"
          docker push "$DEST"

      - name: Update GitOps image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.skip_aws_push == false
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GITOPS_REPO: ${{ secrets.GITOPS_REPO }}
        run: |
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git" gitops
          FILE="gitops/apps/${{ inputs.service_name }}/deployment.yaml"
          sed -i -E "s|(image: .*/${{ inputs.service_name }}:)[^[:space:]]+|\\1${TAG}|" "$FILE"
          cd gitops
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add "apps/${{ inputs.service_name }}/deployment.yaml"
          if git diff --cached --quiet; then
            echo "Nenhuma mudanca de tag"
          else
            git commit -m "chore: bump ${{ inputs.service_name }} to ${TAG}"
            git push
          fi
